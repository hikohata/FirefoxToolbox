<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="popup.css">
  <script src="qrcode.min.js"></script>
  <script src="data-l10n.js"></script>
</head>
<body>
  <div class="container">
    <h2 data-l10n="extensionName">Web Browsing Toolbox</h2>

    <div class="section">
      <h3 data-l10n="stickyNote">Sticky Notes</h3>
      <div class="grid-buttons">
        <button id="btn-toggle-notes" class="btn primary">
          <span class="icon">📝</span> <span id="lbl-toggle-notes" data-l10n="activateNote">Activate Notes</span>
        </button>
        <button id="btn-view-notes-list" class="btn outline">
          <span class="icon">📂</span> <span class="text-label" data-l10n="allNotesList">All Notes List</span>
        </button>
      </div>
    </div>

    <div class="section">
      <h3 data-l10n="popupAndCopy">Popup & copy</h3>
      <div class="grid-buttons">
        <button id="btn-popup-window" class="btn primary"><span class="icon">❐</span> <span class="text-label" data-l10n="popup">Popup</span></button>
        <button id="btn-copy-link" class="btn success"><span class="icon">🔗</span> <span data-l10n="copyLink">Copy link</span></button>
      </div>
      <button id="btn-smart-copy" class="btn outline" style="margin-top:8px;">
        <span class="icon">📋</span> <span data-l10n="copySelected">Element Copy</span>
      </button>
    </div>

    <div class="section">
      <h3 data-l10n="editAndUnlock">Edit & Unlock</h3>
      <div class="grid-buttons">
        <button id="btn-toggle-edit" class="btn outline"><span class="icon">✎</span> <span data-l10n="editMode">Edit Mode</span></button>
        <button id="btn-zap-element" class="btn outline"><span class="icon">⚡</span> <span data-l10n="deleteSelected">Delete Element</span></button>
      </div>
      
      <div class="unlock-options">
        <div class="chk-group"><label><input type="checkbox" id="chk-unlock-context" checked> <span data-l10n="rightClick">Right Click</span></label></div>
        <div class="chk-group"><label><input type="checkbox" id="chk-unlock-select" checked> <span data-l10n="selectText">Select Text</span></label></div>
        <div class="chk-group"><label><input type="checkbox" id="chk-unlock-copy" checked> <span data-l10n="copying">Copying</span></label></div>
        <button id="btn-run-unlock" class="btn primary sm" style="margin-top:5px; width:100%;" data-l10n="unlockChecked">Unlocked checked items</button>
      </div>
    </div>

    <div class="section">
      <h3 data-l10n="quickText">Quick Text</h3>
      <p class="description" data-l10n="quickTextDescription">Paste into the last cursor point</p>
      <div id="quick-text-list" class="quick-text-list">
    </div>
    <div class="input-group">
        <input type="text" id="qt-key" data-l10n-attr="placeholder:quickTextNamePlaceholder" style="width:30%;">
        <input type="text" id="qt-val" data-l10n-attr="placeholder:quickTextValuePlaceholder" style="width:50%;">
        <button id="btn-add-qt" class="btn primary sm" style="width:auto;">＋</button>
      </div>
    </div>

    <div class="section">
      <h3 data-l10n="domainBlocker">Domain Blocker</h3>
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <p class="description" style="margin:0;" data-l10n="domainBlockerDescription">Check to transfer to localhost</p>
        <button id="btn-reset-blocker" class="btn sm" style="width:auto; background:#eee;" data-l10n="clearAll">Clear All</button>
      </div>
      <div id="domain-list" class="domain-list">
        <div class="loading" data-l10n="analyzing">Analyzing...</div>
      </div>
      <button id="btn-reload-page" class="btn primary" style="margin-top:8px;" disabled>
        <span class="icon">↻</span> <span data-l10n="applyChange">Apply Change (reload page)</span>
      </button>
    </div>

    <div class="section">
      <h3 data-l10n="urlQRCode">QR code for URL</h3>
      <div id="qrcode-area" style="text-align:center; padding:10px; background:#fff;">
        <div id="qrcode"></div> </div>
    </div>
</div>
  <script src="polyfill.js"></script> <script src="popup.js"></script>
</body>
</html>
